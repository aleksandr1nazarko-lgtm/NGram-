          # подстроить импорт R под твой проект (если ты менял namespace)
          RIMP=$(grep -hm1 '^import .*\.R;' $J/org/telegram/ui/ArchiveSettingsActivity.java || true)
          if [ -n "$RIMP" ]; then
            F=$J/com/radolyn/ayugram/ui/preferences/GhostPreferencesActivity.java
            sed -i "s|^import org.telegram.messenger.R;|$RIMP|" "$F"
            echo "R import: $RIMP"
          fi

          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b ghost-mode
          git add -A
          git commit -m "Add ghost mode (ported from AyuGram4A)"
          git push origin ghost-mode

          #!/usr/bin/env python3
          """Hooks the NGSave module into Telegram core files. Every anchor must match exactly once, otherwise
          nothing is written and the script exits with an error (so a broken patch never gets committed)."""
          import sys, os

          ROOT = sys.argv[1] if len(sys.argv) > 1 else "."
          JAVA = os.path.join(ROOT, "TMessagesProj/src/main/java/org/telegram")
          MARK = "com.radolyn.ayugram.ngsave"

          pending = {}


          def load(rel):
              p = os.path.join(JAVA, rel)
              if p not in pending:
                  with open(p, encoding="utf-8") as f:
                      pending[p] = f.read()
              return p


          def patch(rel, old, new, name):
              p = load(rel)
              s = pending[p]
              n = s.count(old)
              if n != 1:
                  sys.exit("ANCHOR ERROR [%s] in %s: found %d times (expected 1)" % (name, rel, n))
              pending[p] = s.replace(old, new, 1)
              print("patched:", name)


          # ---- already applied? ---------------------------------------------------------------------------
          if MARK in pending[load("messenger/MessagesController.java")]:
              print("already applied, nothing to do")
              sys.exit(0)

          # 1) new notification id ----------------------------------------------------------------------------
          patch("messenger/NotificationCenter.java",
                "    public static final int communitySwitchedCollapsed = totalEvents++;\n",
                "    public static final int communitySwitchedCollapsed = totalEvents++;\n"
                "    public static final int ngSaveMessagesKept = totalEvents++;\n",
                "NotificationCenter.ngSaveMessagesKept")

          # 2) edit history hook in MessagesStorage -------------------------------------------------------------
          patch("messenger/MessagesStorage.java",
                "                                    if (oldMessage.out && !message.out) {\n"
                "                                        message.out = oldMessage.out;\n"
                "                                    }\n",
                "                                    com.radolyn.ayugram.ngsave.NGSave.onMessageEdited(currentAccount, MessageObject.getDialogId(message), oldMessage, message);\n"
                "                                    if (oldMessage.out && !message.out) {\n"
                "                                        message.out = oldMessage.out;\n"
                "                                    }\n",
                "MessagesStorage edit hook")

          # 3) MessagesController -------------------------------------------------------------------------------
          patch("messenger/MessagesController.java",
                "        final boolean welcomeMessages = mode == ChatActivity.MODE_WELCOME_MESSAGES;\n"
                "        if ((messages == null || messages.isEmpty()) && taskId == 0) {\n"
                "            return;\n"
                "        }\n"
                "        ArrayList<Integer> toSend = null;\n",
                "        final boolean welcomeMessages = mode == ChatActivity.MODE_WELCOME_MESSAGES;\n"
                "        if ((messages == null || messages.isEmpty()) && taskId == 0) {\n"
                "            return;\n"
                "        }\n"
                "        if (messages != null && !messages.isEmpty() && !scheduled && !quickReplies && !welcomeMessages) {\n"
                "            com.radolyn.ayugram.ngsave.NGSave.onOwnDelete(currentAccount, dialogId, messages);\n"
                "        }\n"
                "        ArrayList<Integer> toSend = null;\n",
                "MessagesController own-delete hook")

          patch("messenger/MessagesController.java",
                "        LongSparseArray<ArrayList<Integer>> deletedMessagesFinal = deletedMessages;\n",
                "        com.radolyn.ayugram.ngsave.NGSave.filterDeleted(currentAccount, deletedMessages);\n"
                "        com.radolyn.ayugram.ngsave.NGSave.filterClearHistory(currentAccount, clearHistoryMessages);\n"
                "        LongSparseArray<ArrayList<Integer>> deletedMessagesFinal = deletedMessages;\n",
                "MessagesController update filter")

          patch("messenger/MessagesController.java",
                "    protected void deleteMessagesByPush(long dialogId, ArrayList<Integer> ids, long channelId) {\n",
                "    protected void deleteMessagesByPush(long dialogId, ArrayList<Integer> ids, long channelId) {\n"
                "        com.radolyn.ayugram.ngsave.NGSave.filterPush(currentAccount, channelId, ids);\n"
                "        if (ids == null || ids.isEmpty()) {\n"
                "            return;\n"
                "        }\n",
                "MessagesController push filter")

          # 4) chat cell: marker next to the time --------------------------------------------------------------
          patch("ui/Cells/ChatMessageCell.java",
                "        if (currentMessageObject.isStakedDice()) {\n"
                "            currentTimeString = TextUtils.concat(",
                "        if (com.radolyn.ayugram.ngsave.NGSave.isMarked(currentAccount, currentMessageObject.getDialogId(), currentMessageObject.getId())) {\n"
                "            currentTimeString = TextUtils.concat(com.radolyn.ayugram.ngsave.NGSave.markerText(), \"  \", currentTimeString);\n"
                "        }\n"
                "        if (currentMessageObject.isStakedDice()) {\n"
                "            currentTimeString = TextUtils.concat(",
                "ChatMessageCell marker")

          # 5) ChatActivity -------------------------------------------------------------------------------------
          patch("ui/ChatActivity.java",
                "    public final static int OPTION_COPY = 3;\n",
                "    public final static int OPTION_COPY = 3;\n"
                "    public final static int OPTION_NG_EDIT_HISTORY = 9101;\n",
                "ChatActivity option constant")

          patch("ui/ChatActivity.java",
                "            .add(NotificationCenter.messagesDeleted)\n",
                "            .add(NotificationCenter.messagesDeleted)\n"
                "            .add(NotificationCenter.ngSaveMessagesKept)\n",
                "ChatActivity listener")

          patch("ui/ChatActivity.java",
                "        } else if (id == NotificationCenter.messagesDeleted) {\n",
                "        } else if (id == NotificationCenter.ngSaveMessagesKept) {\n"
                "            if (chatAdapter != null && args.length > 0 && args[0] instanceof Long && (Long) args[0] == dialog_id) {\n"
                "                chatAdapter.notifyDataSetChanged();\n"
                "            }\n"
                "        } else if (id == NotificationCenter.messagesDeleted) {\n",
                "ChatActivity notification handler")

          patch("ui/ChatActivity.java",
                "        if (type == -1) {\n"
                "            if ((selectedObject.type == MessageObject.TYPE_TEXT || selectedObject.type == MessageObject.TYPE_ARTICLE",
                "        if (com.radolyn.ayugram.ngsave.NGSave.hasEditHistory(currentAccount, dialog_id, selectedObject.getId())) {\n"
                "            items.add(LocaleController.getString(R.string.NGSaveEditHistory));\n"
                "            options.add(OPTION_NG_EDIT_HISTORY);\n"
                "            icons.add(R.drawable.msg_edit);\n"
                "        }\n"
                "        if (type == -1) {\n"
                "            if ((selectedObject.type == MessageObject.TYPE_TEXT || selectedObject.type == MessageObject.TYPE_ARTICLE",
                "ChatActivity menu item")

          patch("ui/ChatActivity.java",
                "            case OPTION_COPY: {\n",
                "            case OPTION_NG_EDIT_HISTORY: {\n"
                "                if (selectedObject != null) {\n"
                "                    com.radolyn.ayugram.ngsave.NGSaveUi.showEditHistory(this, dialog_id, selectedObject.getId());\n"
                "                }\n"
                "                break;\n"
                "            }\n"
                "            case OPTION_COPY: {\n",
                "ChatActivity menu action")

          # ---- write everything -----------------------------------------------------------------------------------
          for p, s in pending.items():
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)
          print("all core hooks applied")
          NGEOF

      - name: Hook module into Telegram core
        run: python3 /tmp/ng_patch_core.py .


name: Build NGram

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/go
          sudo rm -rf /opt/microsoft
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          df -h

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Cache CMake builds
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
          key: cxx-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/CMakeLists.txt') }}
          restore-keys: |
            cxx-

      - name: Clone submodules
        run: |
          git clone --depth=1 https://github.com/tdlib/td.git TMessagesProj/jni/td
          git clone --depth=1 https://github.com/dkaraush/tlottie.git TMessagesProj/jni/tlottie
          git clone --depth=1 https://github.com/google/boringssl.git TMessagesProj/jni/third_party/boringssl
          git clone --depth=1 https://github.com/videolan/dav1d.git TMessagesProj/jni/third_party/dav1d
          git clone --depth=1 https://github.com/FFmpeg/FFmpeg.git TMessagesProj/jni/third_party/ffmpeg
          git clone --depth=1 https://github.com/webmproject/libvpx.git TMessagesProj/jni/third_party/libvpx
          git clone --depth=1 https://chromium.googlesource.com/libyuv/libyuv TMessagesProj/jni/third_party/libyuv
          git clone --depth=1 https://github.com/cisco/openh264.git TMessagesProj/jni/third_party/openh264
          git clone --depth=1 https://github.com/xiph/ogg.git TMessagesProj/jni/third_party/xiph/ogg
          git clone --depth=1 https://github.com/xiph/opus.git TMessagesProj/jni/third_party/xiph/opus
          git clone --depth=1 https://github.com/xiph/opusfile.git TMessagesProj/jni/third_party/xiph/opusfile
          git clone --depth=1 https://github.com/dkaraush/jlatexmath-android.git TMessagesProj/lib/jlatexmath
          MEDIA_SHA=$(curl -s "https://api.github.com/repos/DrKLO/Telegram/contents/TMessagesProj_Modules/media" | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          git clone https://github.com/Arseny271/media.git TMessagesProj_Modules/media
          cd TMessagesProj_Modules/media && git checkout $MEDIA_SHA && cd $GITHUB_WORKSPACE

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Install NDK and platforms
        run: |
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Clean old build
        run: |
          rm -rf TMessagesProj_App/build
          rm -rf .gradle
          df -h

      - name: Build Release APK
        run: ./gradlew TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace

      - name: Find APK location
        if: always()
        run: |
          echo "=== Looking for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NGram-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
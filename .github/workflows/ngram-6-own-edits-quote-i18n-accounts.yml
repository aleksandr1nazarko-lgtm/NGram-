name: NGram 6 - свои правки, цитата, язык, Accounts, сессии

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write files
        run: |
          set -e
          mkdir -p TMessagesProj/src/main/java/com/radolyn/ayugram/ui/preferences TMessagesProj/src/main/java/com/radolyn/ayugram/ngsave TMessagesProj/src/main/res/values TMessagesProj/src/main/res/values-ru
          cat > TMessagesProj/src/main/java/com/radolyn/ayugram/ui/preferences/NGramAccountsActivity.java <<'JEOF'
          /*
           * NGram: Accounts section. Switch accounts, rename them locally, delete them,
           * export and import sessions (.ngsess).
           */
          package com.radolyn.ayugram.ui.preferences;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Canvas;
          import android.net.Uri;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import androidx.annotation.NonNull;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;

          import com.radolyn.ayugram.ngsave.NGSession;
          import com.radolyn.ayugram.ngsave.NGStr;

          import org.telegram.messenger.AndroidUtilities;
          import org.telegram.messenger.ApplicationLoader;
          import org.telegram.messenger.FileLog;
          import org.telegram.messenger.MessagesController;
          import org.telegram.messenger.R;
          import org.telegram.messenger.UserConfig;
          import org.telegram.messenger.UserObject;
          import org.telegram.messenger.Utilities;
          import org.telegram.tgnet.TLRPC;
          import org.telegram.ui.ActionBar.ActionBar;
          import org.telegram.ui.ActionBar.ActionBarMenu;
          import org.telegram.ui.ActionBar.ActionBarMenuItem;
          import org.telegram.ui.ActionBar.AlertDialog;
          import org.telegram.ui.ActionBar.BaseFragment;
          import org.telegram.ui.ActionBar.SimpleTextView;
          import org.telegram.ui.ActionBar.Theme;
          import org.telegram.ui.Cells.HeaderCell;
          import org.telegram.ui.Cells.TextInfoPrivacyCell;
          import org.telegram.ui.Components.AvatarDrawable;
          import org.telegram.ui.Components.BackupImageView;
          import org.telegram.ui.Components.BulletinFactory;
          import org.telegram.ui.Components.LayoutHelper;
          import org.telegram.ui.Components.RecyclerListView;
          import org.telegram.ui.LaunchActivity;

          import java.util.ArrayList;
          import java.util.Collections;

          public class NGramAccountsActivity extends BaseFragment {
              private static final int REQ_IMPORT = 7762;
              private static final int MENU_IMPORT = 1;
              private static final int TYPE_HEADER = 0;
              private static final int TYPE_ACCOUNT = 1;
              private static final int TYPE_INFO = 2;

              private RecyclerListView listView;
              private ListAdapter adapter;
              private LinearLayout bottomBar;
              private final ArrayList<Integer> accounts = new ArrayList<>();

              private static SharedPreferences ngPrefs() {
                  return ApplicationLoader.applicationContext.getSharedPreferences("ngram", Context.MODE_PRIVATE);
              }

              private static SharedPreferences namePrefs() {
                  return ApplicationLoader.applicationContext.getSharedPreferences("ngram_accounts", Context.MODE_PRIVATE);
              }

              private void loadAccounts() {
                  accounts.clear();
                  for (int a = 0; a < UserConfig.MAX_ACCOUNT_COUNT; a++) {
                      if (UserConfig.getInstance(a).isClientActivated()) {
                          accounts.add(a);
                      }
                  }
                  Collections.sort(accounts, (o1, o2) -> Long.compare((long) UserConfig.getInstance(o1).loginTime, (long) UserConfig.getInstance(o2).loginTime));
              }

              private void reload() {
                  loadAccounts();
                  if (adapter != null) {
                      adapter.notifyDataSetChanged();
                  }
              }

              @Override
              public boolean onFragmentCreate() {
                  loadAccounts();
                  return super.onFragmentCreate();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  reload();
              }

              @Override
              public View createView(Context context) {
                  actionBar.setBackButtonImage(R.drawable.ic_ab_back);
                  actionBar.setAllowOverlayTitle(true);
                  actionBar.setTitle("Accounts");
                  ActionBarMenu menu = actionBar.createMenu();
                  ActionBarMenuItem other = menu.addItem(0, R.drawable.ic_ab_other);
                  other.addSubItem(MENU_IMPORT, R.drawable.msg_download, NGStr.get(R.string.NGramImportSession));
                  actionBar.setActionBarMenuOnItemClick(new ActionBar.ActionBarMenuOnItemClick() {
                      @Override
                      public void onItemClick(int id) {
                          if (id == -1) {
                              finishFragment();
                          } else if (id == MENU_IMPORT) {
                              startImport();
                          }
                      }
                  });

                  FrameLayout frameLayout = new FrameLayout(context);
                  fragmentView = frameLayout;
                  frameLayout.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundGray));

                  listView = new RecyclerListView(context);
                  listView.setLayoutManager(new LinearLayoutManager(context, LinearLayoutManager.VERTICAL, false));
                  listView.setVerticalScrollBarEnabled(false);
                  listView.setAdapter(adapter = new ListAdapter());
                  listView.setPadding(0, 0, 0, AndroidUtilities.dp(130));
                  listView.setClipToPadding(false);
                  frameLayout.addView(listView, LayoutHelper.createFrame(LayoutHelper.MATCH_PARENT, LayoutHelper.MATCH_PARENT));

                  listView.setOnItemClickListener((view, position) -> {
                      Integer account = accountAt(position);
                      if (account != null && account != UserConfig.selectedAccount && LaunchActivity.instance != null) {
                          LaunchActivity.instance.switchToAccount(account, true);
                      }
                  });
                  listView.setOnItemLongClickListener((view, position) -> {
                      Integer account = accountAt(position);
                      if (account != null) {
                          showActions(account);
                          return true;
                      }
                      return false;
                  });

                  bottomBar = new LinearLayout(context);
                  bottomBar.setOrientation(LinearLayout.VERTICAL);
                  bottomBar.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
                  bottomBar.setPadding(AndroidUtilities.dp(16), AndroidUtilities.dp(10), AndroidUtilities.dp(16), AndroidUtilities.dp(10));
                  bottomBar.addView(makeButton(context, NGStr.get(R.string.NGramExportAllSessions), v -> exportAll()),
                          LayoutHelper.createLinear(LayoutHelper.MATCH_PARENT, 46, 0, 0, 0, 8));
                  bottomBar.addView(makeButton(context, NGStr.get(R.string.NGramImportSession), v -> startImport()),
                          LayoutHelper.createLinear(LayoutHelper.MATCH_PARENT, 46, 0, 0, 0, 0));
                  frameLayout.addView(bottomBar, LayoutHelper.createFrame(LayoutHelper.MATCH_PARENT, LayoutHelper.WRAP_CONTENT, Gravity.BOTTOM));

                  return fragmentView;
              }

              private TextView makeButton(Context context, String text, View.OnClickListener listener) {
                  TextView button = new TextView(context);
                  button.setGravity(Gravity.CENTER);
                  button.setTextSize(TypedValue.COMPLEX_UNIT_DIP, 15);
                  button.setTypeface(AndroidUtilities.bold());
                  button.setTextColor(Theme.getColor(Theme.key_featuredStickers_buttonText));
                  button.setBackground(Theme.createSimpleSelectorRoundRectDrawable(AndroidUtilities.dp(8),
                          Theme.getColor(Theme.key_featuredStickers_addButton), Theme.getColor(Theme.key_featuredStickers_addButtonPressed)));
                  button.setText(text);
                  button.setOnClickListener(listener);
                  return button;
              }

              @Override
              public boolean isSupportEdgeToEdge() {
                  return true;
              }

              @Override
              public void onInsets(int left, int top, int right, int bottom) {
                  if (bottomBar != null) {
                      bottomBar.setPadding(AndroidUtilities.dp(16), AndroidUtilities.dp(10), AndroidUtilities.dp(16), AndroidUtilities.dp(10) + bottom);
                  }
                  if (listView != null) {
                      listView.setPadding(0, 0, 0, AndroidUtilities.dp(130) + bottom);
                  }
              }

              private Integer accountAt(int position) {
                  int index = position - 1;
                  if (index >= 0 && index < accounts.size()) {
                      return accounts.get(index);
                  }
                  return null;
              }

              private String displayName(int account) {
                  UserConfig config = UserConfig.getInstance(account);
                  String custom = namePrefs().getString("name_" + config.getClientUserId(), "");
                  if (!TextUtils.isEmpty(custom)) {
                      return custom;
                  }
                  TLRPC.User user = config.getCurrentUser();
                  return user != null ? UserObject.getUserName(user) : "ID " + config.getClientUserId();
              }

              private void showActions(final int account) {
                  if (getParentActivity() == null) {
                      return;
                  }
                  AlertDialog.Builder builder = new AlertDialog.Builder(getParentActivity());
                  builder.setTitle(displayName(account));
                  CharSequence[] items = new CharSequence[]{
                          NGStr.get(R.string.NGramAccRename),
                          NGStr.get(R.string.NGramExportSession),
                          NGStr.get(R.string.NGramAccDelete)
                  };
                  builder.setItems(items, (dialog, which) -> {
                      if (which == 0) {
                          showRename(account);
                      } else if (which == 1) {
                          askExport(new int[]{account});
                      } else if (which == 2) {
                          confirmDelete(account);
                      }
                  });
                  showDialog(builder.create());
              }

              private void showRename(final int account) {
                  if (getParentActivity() == null) {
                      return;
                  }
                  final long userId = UserConfig.getInstance(account).getClientUserId();
                  final EditText input = new EditText(getParentActivity());
                  input.setSingleLine(true);
                  input.setText(namePrefs().getString("name_" + userId, ""));
                  input.setSelection(input.getText().length());
                  input.setHint(NGStr.get(R.string.NGramAccRenameHint));
                  input.setTextColor(Theme.getColor(Theme.key_dialogTextBlack));
                  input.setHintTextColor(Theme.getColor(Theme.key_dialogTextHint));
                  FrameLayout box = new FrameLayout(getParentActivity());
                  box.setPadding(AndroidUtilities.dp(24), AndroidUtilities.dp(8), AndroidUtilities.dp(24), 0);
                  box.addView(input, LayoutHelper.createFrame(LayoutHelper.MATCH_PARENT, LayoutHelper.WRAP_CONTENT));
                  AlertDialog.Builder builder = new AlertDialog.Builder(getParentActivity());
                  builder.setTitle(NGStr.get(R.string.NGramAccRenameTitle));
                  builder.setView(box);
                  builder.setPositiveButton(NGStr.get(R.string.NGramSave), (dialog, which) -> {
                      String value = input.getText().toString().trim();
                      SharedPreferences.Editor editor = namePrefs().edit();
                      if (value.isEmpty()) {
                          editor.remove("name_" + userId);
                      } else {
                          editor.putString("name_" + userId, value);
                      }
                      editor.apply();
                      reload();
                  });
                  builder.setNegativeButton(NGStr.get(R.string.NGramCancel), null);
                  showDialog(builder.create());
              }

              private void confirmDelete(final int account) {
                  if (getParentActivity() == null) {
                      return;
                  }
                  AlertDialog.Builder builder = new AlertDialog.Builder(getParentActivity());
                  builder.setTitle(NGStr.get(R.string.NGramAccDelete));
                  builder.setMessage(NGStr.get(R.string.NGramAccDeleteMessage).replace("{name}", displayName(account)));
                  builder.setPositiveButton(NGStr.get(R.string.NGramAccDelete), (dialog, which) -> {
                      MessagesController.getInstance(account).performLogout(1);
                      AndroidUtilities.runOnUIThread(this::reload, 700);
                  });
                  builder.setNegativeButton(NGStr.get(R.string.NGramCancel), null);
                  showDialog(builder.create());
              }

              private void exportAll() {
                  if (accounts.isEmpty()) {
                      return;
                  }
                  int[] all = new int[accounts.size()];
                  for (int i = 0; i < all.length; i++) {
                      all[i] = accounts.get(i);
                  }
                  askExport(all);
              }

              private void askExport(final int[] targets) {
                  if (getParentActivity() == null) {
                      return;
                  }
                  if (ngPrefs().getBoolean("ngram_session_warned", false)) {
                      chooseMode(targets);
                      return;
                  }
                  AlertDialog.Builder builder = new AlertDialog.Builder(getParentActivity());
                  builder.setTitle(NGStr.get(R.string.NGramExportWarnTitle));
                  builder.setMessage(NGStr.get(R.string.NGramExportWarnMessage));
                  builder.setPositiveButton(NGStr.get(R.string.NGramContinue), (dialog, which) -> {
                      ngPrefs().edit().putBoolean("ngram_session_warned", true).apply();
                      chooseMode(targets);
                  });
                  builder.setNegativeButton(NGStr.get(R.string.NGramCancel), null);
                  showDialog(builder.create());
              }

              private void chooseMode(final int[] targets) {
                  if (getParentActivity() == null) {
                      return;
                  }
                  AlertDialog.Builder builder = new AlertDialog.Builder(getParentActivity());
                  builder.setTitle(NGStr.get(R.string.NGramExportChoose));
                  builder.setItems(new CharSequence[]{
                          NGStr.get(R.string.NGramExportSessionOnly),
                          NGStr.get(R.string.NGramExportSessionFull)
                  }, (dialog, which) -> startExport(targets, which == 1));
                  showDialog(builder.create());
              }

              private AlertDialog showProgress() {
                  AlertDialog progress = new AlertDialog(getParentActivity(), AlertDialog.ALERT_TYPE_SPINNER);
                  progress.setCanCancel(false);
                  progress.show();
                  return progress;
              }

              private void startExport(final int[] targets, final boolean withMessages) {
                  if (getParentActivity() == null) {
                      return;
                  }
                  final AlertDialog progress = showProgress();
                  Utilities.globalQueue.postRunnable(() -> {
                      final ArrayList<String> paths = new ArrayList<>();
                      boolean failed = false;
                      for (int account : targets) {
                          try {
                              paths.add(NGSession.export(ApplicationLoader.applicationContext, account, withMessages));
                          } catch (NGSession.SessionException e) {
                              FileLog.e(e);
                              failed = true;
                              break;
                          }
                      }
                      final boolean error = failed;
                      AndroidUtilities.runOnUIThread(() -> {
                          try {
                              progress.dismiss();
                          } catch (Exception ignore) {
                          }
                          if (error) {
                              BulletinFactory.of(this).createErrorBulletin(NGStr.get(R.string.NGramExportError)).show();
                          } else {
                              String shown = paths.size() == 1 ? paths.get(0) : "Download/NGram (" + paths.size() + ")";
                              BulletinFactory.of(this).createSuccessBulletin(NGStr.get(R.string.NGramExportDone).replace("{path}", shown)).show();
                          }
                      });
                  });
              }

              private void startImport() {
                  if (getParentActivity() == null) {
                      return;
                  }
                  try {
                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      intent.setType("*/*");
                      startActivityForResult(intent, REQ_IMPORT);
                  } catch (Throwable e) {
                      FileLog.e(e);
                  }
              }

              @Override
              public void onActivityResultFragment(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQ_IMPORT) {
                      if (resultCode == Activity.RESULT_OK && data != null && data.getData() != null) {
                          doImport(data.getData());
                      }
                      return;
                  }
                  super.onActivityResultFragment(requestCode, resultCode, data);
              }

              private void doImport(final Uri uri) {
                  if (getParentActivity() == null) {
                      return;
                  }
                  final AlertDialog progress = showProgress();
                  Utilities.globalQueue.postRunnable(() -> {
                      int errorCode = 0;
                      try {
                          NGSession.importSession(ApplicationLoader.applicationContext, uri);
                      } catch (NGSession.SessionException e) {
                          FileLog.e(e);
                          errorCode = e.code;
                      }
                      final int code = errorCode;
                      AndroidUtilities.runOnUIThread(() -> {
                          try {
                              progress.dismiss();
                          } catch (Exception ignore) {
                          }
                          if (code == 0) {
                              showRestart();
                          } else {
                              int text = code == NGSession.ERR_NO_SLOT ? R.string.NGramImportNoSlot
                                      : code == NGSession.ERR_BAD_FILE ? R.string.NGramImportBad
                                      : code == NGSession.ERR_EXISTS ? R.string.NGramImportExists
                                      : R.string.NGramImportError;
                              BulletinFactory.of(this).createErrorBulletin(NGStr.get(text)).show();
                          }
                      });
                  });
              }

              private void showRestart() {
                  if (getParentActivity() == null) {
                      return;
                  }
                  AlertDialog.Builder builder = new AlertDialog.Builder(getParentActivity());
                  builder.setTitle(NGStr.get(R.string.NGramImportSession));
                  builder.setMessage(NGStr.get(R.string.NGramImportRestart));
                  builder.setPositiveButton(NGStr.get(R.string.NGramRestartButton), (dialog, which) -> NGSession.restartApp(ApplicationLoader.applicationContext));
                  AlertDialog dialog = builder.create();
                  dialog.setCanceledOnTouchOutside(false);
                  showDialog(dialog);
              }

              private class AccountRowCell extends FrameLayout {
                  private final BackupImageView avatarView;
                  private final SimpleTextView nameView;
                  private final SimpleTextView statusView;
                  private final AvatarDrawable avatarDrawable = new AvatarDrawable();
                  private boolean divider;

                  AccountRowCell(Context context) {
                      super(context);
                      setWillNotDraw(false);
                      avatarView = new BackupImageView(context);
                      avatarView.setRoundRadius(AndroidUtilities.dp(22));
                      addView(avatarView, LayoutHelper.createFrame(44, 44, Gravity.LEFT | Gravity.CENTER_VERTICAL, 16, 0, 0, 0));
                      nameView = new SimpleTextView(context);
                      nameView.setTextSize(16);
                      nameView.setTypeface(AndroidUtilities.bold());
                      nameView.setTextColor(Theme.getColor(Theme.key_windowBackgroundWhiteBlackText));
                      nameView.setGravity(Gravity.LEFT);
                      addView(nameView, LayoutHelper.createFrame(LayoutHelper.MATCH_PARENT, 22, Gravity.LEFT | Gravity.TOP, 72, 11, 16, 0));
                      statusView = new SimpleTextView(context);
                      statusView.setTextSize(13);
                      statusView.setGravity(Gravity.LEFT);
                      addView(statusView, LayoutHelper.createFrame(LayoutHelper.MATCH_PARENT, 18, Gravity.LEFT | Gravity.TOP, 72, 35, 16, 0));
                  }

                  void bind(int account, boolean needDivider) {
                      divider = needDivider;
                      TLRPC.User user = UserConfig.getInstance(account).getCurrentUser();
                      avatarDrawable.setInfo(account, user);
                      avatarView.getImageReceiver().setCurrentAccount(account);
                      avatarView.setForUserOrChat(user, avatarDrawable);
                      nameView.setText(displayName(account));
                      boolean active = account == UserConfig.selectedAccount;
                      statusView.setText(NGStr.get(active ? R.string.NGramAccActive : R.string.NGramAccInactive));
                      statusView.setTextColor(Theme.getColor(active ? Theme.key_windowBackgroundWhiteGreenText : Theme.key_windowBackgroundWhiteGrayText2));
                      setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
                  }

                  @Override
                  protected void onMeasure(int widthMeasureSpec, int heightMeasureSpec) {
                      super.onMeasure(widthMeasureSpec, MeasureSpec.makeMeasureSpec(AndroidUtilities.dp(64), MeasureSpec.EXACTLY));
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      if (divider) {
                          canvas.drawLine(AndroidUtilities.dp(72), getHeight() - 1, getWidth(), getHeight() - 1, Theme.dividerPaint);
                      }
                  }
              }

              private class ListAdapter extends RecyclerListView.SelectionAdapter {
                  @NonNull
                  @Override
                  public RecyclerView.ViewHolder onCreateViewHolder(@NonNull ViewGroup parent, int viewType) {
                      View view;
                      if (viewType == TYPE_HEADER) {
                          view = new HeaderCell(getContext());
                          view.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
                      } else if (viewType == TYPE_ACCOUNT) {
                          view = new AccountRowCell(getContext());
                      } else {
                          view = new TextInfoPrivacyCell(getContext());
                      }
                      return new RecyclerListView.Holder(view);
                  }

                  @Override
                  public void onBindViewHolder(@NonNull RecyclerView.ViewHolder holder, int position) {
                      int type = holder.getItemViewType();
                      if (type == TYPE_HEADER) {
                          ((HeaderCell) holder.itemView).setText(NGStr.get(R.string.NGramAccHeader));
                      } else if (type == TYPE_ACCOUNT) {
                          int index = position - 1;
                          ((AccountRowCell) holder.itemView).bind(accounts.get(index), index < accounts.size() - 1);
                      } else {
                          ((TextInfoPrivacyCell) holder.itemView).setText(NGStr.get(R.string.NGramAccInfo));
                      }
                  }

                  @Override
                  public int getItemCount() {
                      return accounts.size() + 2;
                  }

                  @Override
                  public boolean isEnabled(RecyclerView.ViewHolder holder) {
                      return holder.getItemViewType() == TYPE_ACCOUNT;
                  }

                  @Override
                  public int getItemViewType(int position) {
                      if (position == 0) {
                          return TYPE_HEADER;
                      }
                      return position == getItemCount() - 1 ? TYPE_INFO : TYPE_ACCOUNT;
                  }
              }
          }
          JEOF
          cat > TMessagesProj/src/main/java/com/radolyn/ayugram/ngsave/NGSession.java <<'JEOF'
          /*
           * NGram: export and import of account sessions (.ngsess is a plain ZIP).
           * A session = tgnet.dat + dc*conf.dat (auth keys) + userconfig xml, optionally the message database.
           */
          package com.radolyn.ayugram.ngsave;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;

          import org.telegram.messenger.ApplicationLoader;
          import org.telegram.messenger.FileLog;
          import org.telegram.messenger.UserConfig;

          import java.io.BufferedInputStream;
          import java.io.BufferedOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;
          import java.util.zip.ZipOutputStream;

          public class NGSession {
              public static final String EXT = ".ngsess";
              public static final int ERR_BAD_FILE = 1;
              public static final int ERR_NO_SLOT = 2;
              public static final int ERR_EXISTS = 3;
              public static final int ERR_IO = 4;

              private static final long MAX_TOTAL = 3L * 1024 * 1024 * 1024;
              private static final Pattern DC_FILE = Pattern.compile("^(dc\\d+conf|cdnkeys)\\.dat(\\.bak)?$");
              private static final Pattern E_META = Pattern.compile("^meta\\.txt$");
              private static final Pattern E_TGNET = Pattern.compile("^account(\\d+)\\.dat$");
              private static final Pattern E_PREFS = Pattern.compile("^userconf(\\d+)\\.xml$");
              private static final Pattern E_DB = Pattern.compile("^cache4_(\\d+)\\.db$");
              private static final Pattern E_WAL = Pattern.compile("^cache4_(\\d+)\\.db-wal$");
              private static final Pattern E_DC = Pattern.compile("^dcfiles/([A-Za-z0-9_]+\\.dat(\\.bak)?)$");

              public static class SessionException extends Exception {
                  public final int code;

                  public SessionException(int code, String message) {
                      super(message);
                      this.code = code;
                  }
              }

              private static File accountDir(int account) {
                  File dir = ApplicationLoader.getFilesDirFixed();
                  if (account != 0) {
                      dir = new File(dir, "account" + account);
                  }
                  return dir;
              }

              private static File prefsFile(int account) {
                  File shared = new File(ApplicationLoader.applicationContext.getApplicationInfo().dataDir, "shared_prefs");
                  return new File(shared, (account == 0 ? "userconfing" : "userconfig" + account) + ".xml");
              }

              /** Сохраняет сессию аккаунта в Download/NGram и возвращает путь для показа. */
              public static String export(Context context, int account, boolean withMessages) throws SessionException {
                  File tmp = null;
                  try {
                      UserConfig config = UserConfig.getInstance(account);
                      if (!config.isClientActivated()) {
                          throw new SessionException(ERR_IO, "account is not active");
                      }
                      config.saveConfig(false);
                      try {
                          Thread.sleep(400);
                      } catch (InterruptedException ignore) {
                      }
                      long userId = config.getClientUserId();
                      tmp = new File(context.getCacheDir(), "ngsess_" + System.nanoTime() + EXT);
                      try (ZipOutputStream zip = new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(tmp)))) {
                          zip.setLevel(5);
                          putText(zip, "meta.txt", "ngram_session=1\nuserId=" + userId + "\nslot=" + account + "\nmessages=" + withMessages + "\n");
                          File dir = accountDir(account);
                          File[] files = dir.listFiles();
                          if (files != null) {
                              for (File f : files) {
                                  String n = f.getName();
                                  if (!f.isFile()) {
                                      continue;
                                  }
                                  if (n.equals("tgnet.dat")) {
                                      putFile(zip, "account" + account + ".dat", f);
                                  } else if (DC_FILE.matcher(n).matches()) {
                                      putFile(zip, "dcfiles/" + n, f);
                                  }
                              }
                          }
                          File prefs = prefsFile(account);
                          if (prefs.exists()) {
                              putFile(zip, "userconf" + account + ".xml", prefs);
                          }
                          if (withMessages) {
                              File db = new File(dir, "cache4.db");
                              if (db.exists()) {
                                  putFile(zip, "cache4_" + account + ".db", db);
                              }
                              File wal = new File(dir, "cache4.db-wal");
                              if (wal.exists()) {
                                  putFile(zip, "cache4_" + account + ".db-wal", wal);
                              }
                          }
                      }
                      return saveToDownloads(context, tmp, "ngram_session_" + userId + "_" + System.currentTimeMillis() + EXT);
                  } catch (SessionException e) {
                      throw e;
                  } catch (Throwable e) {
                      FileLog.e(e);
                      throw new SessionException(ERR_IO, String.valueOf(e));
                  } finally {
                      if (tmp != null) {
                          tmp.delete();
                      }
                  }
              }

              private static void putText(ZipOutputStream zip, String name, String text) throws IOException {
                  zip.putNextEntry(new ZipEntry(name));
                  zip.write(text.getBytes("UTF-8"));
                  zip.closeEntry();
              }

              private static void putFile(ZipOutputStream zip, String name, File file) throws IOException {
                  zip.putNextEntry(new ZipEntry(name));
                  try (InputStream in = new FileInputStream(file)) {
                      copy(in, zip);
                  }
                  zip.closeEntry();
              }

              private static long copy(InputStream in, OutputStream out) throws IOException {
                  byte[] buffer = new byte[64 * 1024];
                  long total = 0;
                  int n;
                  while ((n = in.read(buffer)) > 0) {
                      out.write(buffer, 0, n);
                      total += n;
                  }
                  return total;
              }

              private static String saveToDownloads(Context context, File src, String name) throws IOException {
                  if (Build.VERSION.SDK_INT >= 29) {
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                      values.put(MediaStore.MediaColumns.MIME_TYPE, "application/octet-stream");
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/NGram");
                      values.put(MediaStore.MediaColumns.IS_PENDING, 1);
                      ContentResolver resolver = context.getContentResolver();
                      Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (uri == null) {
                          throw new IOException("MediaStore insert failed");
                      }
                      try (OutputStream out = resolver.openOutputStream(uri); InputStream in = new FileInputStream(src)) {
                          if (out == null) {
                              throw new IOException("openOutputStream failed");
                          }
                          copy(in, out);
                      }
                      ContentValues done = new ContentValues();
                      done.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      resolver.update(uri, done, null, null);
                  } else {
                      File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "NGram");
                      if (!dir.exists() && !dir.mkdirs()) {
                          throw new IOException("mkdirs failed");
                      }
                      try (OutputStream out = new FileOutputStream(new File(dir, name)); InputStream in = new FileInputStream(src)) {
                          copy(in, out);
                      }
                  }
                  return "Download/NGram/" + name;
              }

              /** Импортирует .ngsess в первый свободный слот. Возвращает номер слота. */
              public static int importSession(Context context, Uri uri) throws SessionException {
                  File tmpDir = new File(context.getCacheDir(), "ngsess_import_" + System.nanoTime());
                  try {
                      if (!tmpDir.mkdirs()) {
                          throw new SessionException(ERR_IO, "cache dir");
                      }
                      try (InputStream raw = context.getContentResolver().openInputStream(uri)) {
                          if (raw == null) {
                              throw new SessionException(ERR_IO, "open failed");
                          }
                          BufferedInputStream in = new BufferedInputStream(raw);
                          in.mark(8);
                          byte[] magic = new byte[4];
                          int read = 0;
                          while (read < 4) {
                              int n = in.read(magic, read, 4 - read);
                              if (n < 0) {
                                  break;
                              }
                              read += n;
                          }
                          if (read < 4 || magic[0] != 0x50 || magic[1] != 0x4B || magic[2] != 0x03 || magic[3] != 0x04) {
                              throw new SessionException(ERR_BAD_FILE, "not a zip");
                          }
                          in.reset();
                          unpack(in, tmpDir);
                      }
                      File meta = new File(tmpDir, "meta.txt");
                      File tgnet = new File(tmpDir, "tgnet.dat");
                      File prefs = new File(tmpDir, "userconf.xml");
                      if (!meta.exists() || !tgnet.exists() || !prefs.exists()) {
                          throw new SessionException(ERR_BAD_FILE, "missing files");
                      }
                      long userId = 0;
                      try (InputStream in = new FileInputStream(meta)) {
                          java.io.ByteArrayOutputStream bos = new java.io.ByteArrayOutputStream();
                          copy(in, bos);
                          for (String line : bos.toString("UTF-8").split("\n")) {
                              if (line.startsWith("userId=")) {
                                  userId = Long.parseLong(line.substring(7).trim());
                              }
                          }
                      } catch (NumberFormatException e) {
                          throw new SessionException(ERR_BAD_FILE, "bad meta");
                      }
                      if (userId == 0) {
                          throw new SessionException(ERR_BAD_FILE, "bad meta");
                      }
                      int slot = -1;
                      for (int a = 0; a < UserConfig.MAX_ACCOUNT_COUNT; a++) {
                          UserConfig config = UserConfig.getInstance(a);
                          if (config.isClientActivated()) {
                              if (config.getClientUserId() == userId) {
                                  throw new SessionException(ERR_EXISTS, "already added");
                              }
                          } else if (slot < 0) {
                              slot = a;
                          }
                      }
                      if (slot < 0) {
                          throw new SessionException(ERR_NO_SLOT, "no free slot");
                      }
                      File dir = accountDir(slot);
                      if (!dir.exists() && !dir.mkdirs()) {
                          throw new SessionException(ERR_IO, "mkdirs");
                      }
                      File[] old = dir.listFiles();
                      if (old != null) {
                          for (File f : old) {
                              String n = f.getName();
                              if (n.startsWith("tgnet.dat") || DC_FILE.matcher(n).matches()) {
                                  f.delete();
                              }
                          }
                      }
                      place(tgnet, new File(dir, "tgnet.dat"));
                      File[] tmpFiles = tmpDir.listFiles();
                      if (tmpFiles != null) {
                          for (File f : tmpFiles) {
                              if (f.getName().startsWith("dc_")) {
                                  place(f, new File(dir, f.getName().substring(3)));
                              }
                          }
                      }
                      File prefsTarget = prefsFile(slot);
                      File prefsDir = prefsTarget.getParentFile();
                      if (prefsDir != null && !prefsDir.exists()) {
                          prefsDir.mkdirs();
                      }
                      place(prefs, prefsTarget);
                      File db = new File(tmpDir, "cache4.db");
                      if (db.exists()) {
                          new File(dir, "cache4.db").delete();
                          new File(dir, "cache4.db-wal").delete();
                          new File(dir, "cache4.db-shm").delete();
                          place(db, new File(dir, "cache4.db"));
                          File wal = new File(tmpDir, "cache4.db-wal");
                          if (wal.exists()) {
                              place(wal, new File(dir, "cache4.db-wal"));
                          }
                      }
                      return slot;
                  } catch (SessionException e) {
                      throw e;
                  } catch (Throwable e) {
                      FileLog.e(e);
                      throw new SessionException(ERR_IO, String.valueOf(e));
                  } finally {
                      deleteRecursive(tmpDir);
                  }
              }

              private static void unpack(InputStream in, File tmpDir) throws IOException {
                  long total = 0;
                  try (ZipInputStream zip = new ZipInputStream(in)) {
                      ZipEntry entry;
                      while ((entry = zip.getNextEntry()) != null) {
                          String name = entry.getName();
                          String target = null;
                          Matcher m;
                          if (E_META.matcher(name).matches()) {
                              target = "meta.txt";
                          } else if (E_TGNET.matcher(name).matches()) {
                              target = "tgnet.dat";
                          } else if (E_PREFS.matcher(name).matches()) {
                              target = "userconf.xml";
                          } else if (E_DB.matcher(name).matches()) {
                              target = "cache4.db";
                          } else if (E_WAL.matcher(name).matches()) {
                              target = "cache4.db-wal";
                          } else if ((m = E_DC.matcher(name)).matches()) {
                              target = "dc_" + m.group(1);
                          }
                          if (target == null || entry.isDirectory()) {
                              continue;
                          }
                          try (OutputStream out = new FileOutputStream(new File(tmpDir, target))) {
                              byte[] buffer = new byte[64 * 1024];
                              int n;
                              while ((n = zip.read(buffer)) > 0) {
                                  total += n;
                                  if (total > MAX_TOTAL) {
                                      throw new IOException("session is too large");
                                  }
                                  out.write(buffer, 0, n);
                              }
                          }
                      }
                  }
              }

              private static void place(File from, File to) throws IOException {
                  File part = new File(to.getParentFile(), to.getName() + ".part");
                  try (InputStream in = new FileInputStream(from); OutputStream out = new FileOutputStream(part)) {
                      copy(in, out);
                  }
                  if (to.exists() && !to.delete()) {
                      throw new IOException("cannot replace " + to);
                  }
                  if (!part.renameTo(to)) {
                      throw new IOException("cannot rename " + part);
                  }
              }

              private static void deleteRecursive(File file) {
                  File[] children = file.listFiles();
                  if (children != null) {
                      for (File c : children) {
                          deleteRecursive(c);
                      }
                  }
                  file.delete();
              }

              public static void restartApp(Context context) {
                  try {
                      Intent intent = context.getPackageManager().getLaunchIntentForPackage(context.getPackageName());
                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK);
                          PendingIntent pending = PendingIntent.getActivity(context, 7761, intent, PendingIntent.FLAG_CANCEL_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                          AlarmManager alarm = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                          if (alarm != null) {
                              alarm.set(AlarmManager.RTC, System.currentTimeMillis() + 400, pending);
                          }
                      }
                  } catch (Throwable e) {
                      FileLog.e(e);
                  }
                  android.os.Process.killProcess(android.os.Process.myPid());
                  System.exit(0);
              }
          }
